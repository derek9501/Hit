<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒球擊球軌跡 3D 模擬器 (純數據顯示)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }

        /* 獨立開關鍵盤 */
        #toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 11;
            background: #2ed573;
            color: #111;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* 可折疊控制面板 */
        #info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            width: 250px;
            font-size: 13px;
            line-height: 1.5;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #info-panel.collapsed {
            transform: translateX(-300px);
            opacity: 0;
            pointer-events: none;
        }

        #info-panel h2 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: #4da6ff;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }

        .action-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #ff4757;
            border: none;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .action-btn:hover {
            background: #e84118;
        }

        .data-group {
            margin-bottom: 6px;
        }
    </style>
    <!-- 引入 Three.js 與 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <button id="toggle-btn" onclick="togglePanel()">面板 ⚙️</button>

    <div id="info-panel">
        <h2>目前擊球數據</h2>
        <div id="data-display">載入中...</div>

        <button class="action-btn" onclick="togglePanel()">收合面板 ✕</button>
    </div>

    <script>
        // --- 1. 面板收合切換 ---
        function togglePanel() {
            document.getElementById('info-panel').classList.toggle('collapsed');
        }

        // --- 2. 預設數據 ---
        const defaultHitData = {
            "Hit": {
                "Launch": {
                    "Angle": 17.281986,
                    "Direction": -174.22984,
                    "ExitSpeed": 116.80314585984,
                    "HitSpinRate": 1088.3491
                },
                "LandingFlat": {
                    "Bearing": -174.6862,
                    "Distance": 48.163377384,
                    "HangTime": 1.87322,
                    "Confidence": null
                }
            }
        };

        // --- 3. 解析網址參數 (URL Parameters) ---
        function parseUrlData() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('data')) {
                try {
                    return JSON.parse(params.get('data'));
                } catch(e) {
                    console.error("JSON 解析失敗，改用預設數據");
                }
            }
            if (params.has('la') || params.has('dist')) {
                return {
                    "Hit": {
                        "Launch": {
                            "Angle": parseFloat(params.get('la')) || defaultHitData.Hit.Launch.Angle,
                            "Direction": parseFloat(params.get('dir')) || defaultHitData.Hit.Launch.Direction,
                            "ExitSpeed": parseFloat(params.get('speed')) || defaultHitData.Hit.Launch.ExitSpeed,
                            "HitSpinRate": parseFloat(params.get('spin')) || defaultHitData.Hit.Launch.HitSpinRate
                        },
                        "LandingFlat": {
                            "Bearing": parseFloat(params.get('dir')) || defaultHitData.Hit.LandingFlat.Bearing,
                            "Distance": parseFloat(params.get('dist')) || defaultHitData.Hit.LandingFlat.Distance,
                            "HangTime": parseFloat(params.get('time')) || defaultHitData.Hit.LandingFlat.HangTime
                        }
                    }
                };
            }
            return defaultHitData;
        }

        const hitData = parseUrlData();
        const launch = hitData.Hit.Launch;
        const landing = hitData.Hit.LandingFlat;

        document.getElementById('data-display').innerHTML = `
            <div class="data-group"><b>擊球初速:</b> ${launch.ExitSpeed.toFixed(1)} mph</div>
            <div class="data-group"><b>仰角 (Angle):</b> ${launch.Angle.toFixed(2)}°</div>
            <div class="data-group"><b>方向角 (Direction):</b> ${launch.Direction.toFixed(2)}°</div>
            <div class="data-group"><b>飛行距離:</b> ${landing.Distance.toFixed(2)} m</div>
            <div class="data-group"><b>滯空時間:</b> ${landing.HangTime ? landing.HangTime.toFixed(2) + ' s' : 'N/A'}</div>
            <div class="data-group"><b>轉速:</b> ${launch.HitSpinRate ? launch.HitSpinRate.toFixed(0) + ' rpm' : 'N/A'}</div>
        `;

        // --- 4. 初始化 Three.js 場景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a202c);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 45, 90);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(40, 80, 40);
        scene.add(dirLight);

        // --- 5. 建構真實比例棒球場 (單位：公尺 m) ---
        const fieldGroup = new THREE.Group();

        // 5.1 外野草皮
        const grassGeo = new THREE.PlaneGeometry(300, 300);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        fieldGroup.add(grass);

        // 5.2 內野紅土區
        const dirtGeo = new THREE.CircleGeometry(28.9, 32, Math.PI * 0.25, Math.PI * 0.5);
        const dirtMat = new THREE.MeshLambertMaterial({ color: 0xb45309 });
        const dirt = new THREE.Mesh(dirtGeo, dirtMat);
        dirt.rotation.x = -Math.PI / 2;
        dirt.position.set(0, 0.01, 0);
        fieldGroup.add(dirt);

        // 5.3 本壘板
        const homePlateShape = new THREE.Shape();
        homePlateShape.moveTo(0, 0);
        homePlateShape.lineTo(0.216, -0.216);
        homePlateShape.lineTo(0.216, -0.432);
        homePlateShape.lineTo(-0.216, -0.432);
        homePlateShape.lineTo(-0.216, -0.216);
        const homePlateGeo = new THREE.ShapeGeometry(homePlateShape);
        const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        const homePlate = new THREE.Mesh(homePlateGeo, whiteMat);
        homePlate.rotation.x = -Math.PI / 2;
        homePlate.position.set(0, 0.02, 0);
        fieldGroup.add(homePlate);

        // 5.4 投手丘與投手板
        const moundGeo = new THREE.CylinderGeometry(2.75, 2.75, 0.25, 32);
        const moundMat = new THREE.MeshLambertMaterial({ color: 0xb45309 });
        const mound = new THREE.Mesh(moundGeo, moundMat);
        mound.position.set(0, 0.125, -18.44);
        fieldGroup.add(mound);

        const rubberGeo = new THREE.BoxGeometry(0.61, 0.05, 0.15);
        const rubber = new THREE.Mesh(rubberGeo, whiteMat);
        rubber.position.set(0, 0.26, -18.44);
        fieldGroup.add(rubber);

        // 5.5 壘包 (一壘、二壘、三壘)
        const baseGeo = new THREE.BoxGeometry(0.38, 0.08, 0.38);
        
        const base1 = new THREE.Mesh(baseGeo, whiteMat);
        base1.position.set(19.39, 0.04, -19.39);
        base1.rotation.y = Math.PI / 4;
        fieldGroup.add(base1);

        const base2 = new THREE.Mesh(baseGeo, whiteMat);
        base2.position.set(0, 0.04, -38.79);
        base2.rotation.y = Math.PI / 4;
        fieldGroup.add(base2);

        const base3 = new THREE.Mesh(baseGeo, whiteMat);
        base3.position.set(-19.39, 0.04, -19.39);
        base3.rotation.y = Math.PI / 4;
        fieldGroup.add(base3);

        // 5.6 界外線
        const foulLineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        
        const rightFoulGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0.02, 0),
            new THREE.Vector3(70.71, 0.02, -70.71)
        ]);
        fieldGroup.add(new THREE.Line(rightFoulGeo, foulLineMat));

        const leftFoulGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0.02, 0),
            new THREE.Vector3(-70.71, 0.02, -70.71)
        ]);
        fieldGroup.add(new THREE.Line(leftFoulGeo, foulLineMat));

        // 5.7 外野全壘打牆
        const fenceGeo = new THREE.CylinderGeometry(105, 105, 3, 48, 1, true, Math.PI * 0.25, Math.PI * 0.5);
        const fenceMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a, side: THREE.DoubleSide });
        const fence = new THREE.Mesh(fenceGeo, fenceMat);
        fence.position.set(0, 1.5, 0);
        fieldGroup.add(fence);

        scene.add(fieldGroup);

        // --- 6. 3D 擊球軌跡計算與繪製 ---
        const radDir = (launch.Direction + 90) * (Math.PI / 180);
        const dist = landing.Distance;

        const endX = dist * Math.cos(radDir);
        const endZ = -dist * Math.sin(radDir);
        const endY = 0;

        const midX = endX / 2;
        const midZ = endZ / 2;
        const apexHeight = Math.max(1.5, (dist * Math.tan(launch.Angle * (Math.PI / 180))) / 2);

        const curve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(0, 0.5, 0),
            new THREE.Vector3(midX, apexHeight, midZ),
            new THREE.Vector3(endX, endY, endZ)
        );

        const points = curve.getPoints(60);
        const trajectoryGeo = new THREE.BufferGeometry().setFromPoints(points);
        const trajectoryMat = new THREE.LineDashedMaterial({
            color: 0xef4444,
            dashSize: 1.5,
            gapSize: 0.8,
            linewidth: 3
        });
        const trajectoryLine = new THREE.Line(trajectoryGeo, trajectoryMat);
        trajectoryLine.computeLineDistances();
        scene.add(trajectoryLine);

        // 落點標記
        const landingMarkerGeo = new THREE.RingGeometry(0.5, 1.0, 32);
        const landingMarkerMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide });
        const landingMarker = new THREE.Mesh(landingMarkerGeo, landingMarkerMat);
        landingMarker.rotation.x = -Math.PI / 2;
        landingMarker.position.set(endX, 0.03, endZ);
        scene.add(landingMarker);

        // --- 7. 渲染與縮放適應 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
