<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒球擊球軌跡 3D 模擬器</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff; /* 純白背景 */
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        // --- 1. 預設數據 ---
        const defaultHitData = {
            "Hit": {
                "Launch": {
                    "Angle": 25,
                    "Direction": -165,
                    "ExitSpeed": 100,
                    "HitSpinRate": 1000
                },
                "LandingFlat": {
                    "Bearing": -165,
                    "Distance": 35,
                    "HangTime": 2.0
                }
            }
        };

        function parseUrlData() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('data')) {
                try { return JSON.parse(params.get('data')); } catch(e) {}
            }
            if (params.has('la') || params.has('dist')) {
                return {
                    "Hit": {
                        "Launch": {
                            "Angle": parseFloat(params.get('la')) || defaultHitData.Hit.Launch.Angle,
                            "Direction": parseFloat(params.get('dir')) || defaultHitData.Hit.Launch.Direction,
                            "ExitSpeed": parseFloat(params.get('speed')) || defaultHitData.Hit.Launch.ExitSpeed,
                            "HitSpinRate": parseFloat(params.get('spin')) || defaultHitData.Hit.Launch.HitSpinRate
                        },
                        "LandingFlat": {
                            "Bearing": parseFloat(params.get('dir')) || defaultHitData.Hit.LandingFlat.Bearing,
                            "Distance": parseFloat(params.get('dist')) || defaultHitData.Hit.LandingFlat.Distance,
                            "HangTime": parseFloat(params.get('time')) || defaultHitData.Hit.LandingFlat.HangTime
                        }
                    }
                };
            }
            return defaultHitData;
        }

        const hitData = parseUrlData();
        const launch = hitData.Hit.Launch;
        const landing = hitData.Hit.LandingFlat;

        // --- 2. 初始化 Three.js 場景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 設定類似圖片的 Isometric 45度角俯視視角
        camera.position.set(0, 80, 95);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, -25); // 鏡頭對準內野中心

        // --- 3. 繪製極簡插畫風格棒球場 ---
        const fieldGroup = new THREE.Group();

        // 3.1 外野扇形草地 (Arc Turf) - 半徑 75m, 角度 90度
        const grassGeo = new THREE.RingGeometry(0, 75, 64, 1, Math.PI * 0.25, Math.PI * 0.5);
        const grassMat = new THREE.MeshBasicMaterial({ color: 0x598353, side: THREE.DoubleSide });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        fieldGroup.add(grass);

        // 3.2 內野紅土扇形區 (Infield Dirt Sector)
        const dirtGeo = new THREE.RingGeometry(0, 32, 48, 1, Math.PI * 0.25, Math.PI * 0.5);
        const dirtMat = new THREE.MeshBasicMaterial({ color: 0xc1a173, side: THREE.DoubleSide });
        const dirt = new THREE.Mesh(dirtGeo, dirtMat);
        dirt.rotation.x = -Math.PI / 2;
        dirt.position.y = 0.01;
        fieldGroup.add(dirt);

        // 3.3 內野正方形草皮區 (Inner Infield Diamond Turf)
        const innerGrassShape = new THREE.Shape();
        innerGrassShape.moveTo(0, 0);
        innerGrassShape.lineTo(19.39, -19.39);
        innerGrassShape.lineTo(0, -38.78);
        innerGrassShape.lineTo(-19.39, -19.39);
        innerGrassShape.closePath();
        const innerGrassGeo = new THREE.ShapeGeometry(innerGrassShape);
        const innerGrassMat = new THREE.MeshBasicMaterial({ color: 0x598353, side: THREE.DoubleSide });
        const innerGrass = new THREE.Mesh(innerGrassGeo, innerGrassMat);
        innerGrass.rotation.x = -Math.PI / 2;
        innerGrass.position.y = 0.02;
        fieldGroup.add(innerGrass);

        // 3.4 白線 (Foul & Infield Lines)
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        
        // 兩側界線
        const rightLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.03, 0), new THREE.Vector3(53, 0.03, -53)]);
        const leftLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.03, 0), new THREE.Vector3(-53, 0.03, -53)]);
        fieldGroup.add(new THREE.Line(rightLineGeo, lineMat));
        fieldGroup.add(new THREE.Line(leftLineGeo, lineMat));

        // 內野稜線
        const infieldLineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(19.39, 0.03, -19.39),
            new THREE.Vector3(0, 0.03, -38.78),
            new THREE.Vector3(-19.39, 0.03, -19.39)
        ]);
        fieldGroup.add(new THREE.Line(infieldLineGeo, lineMat));

        // 3.5 投手丘 (Pitcher's Mound)
        const moundGeo = new THREE.CircleGeometry(2.5, 32);
        const moundMat = new THREE.MeshBasicMaterial({ color: 0xc1a173, side: THREE.DoubleSide });
        const mound = new THREE.Mesh(moundGeo, moundMat);
        mound.rotation.x = -Math.PI / 2;
        mound.position.set(0, 0.03, -18.44);
        fieldGroup.add(mound);

        const rubberGeo = new THREE.PlaneGeometry(0.8, 0.3);
        const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        const rubber = new THREE.Mesh(rubberGeo, whiteMat);
        rubber.rotation.x = -Math.PI / 2;
        rubber.position.set(0, 0.04, -18.44);
        fieldGroup.add(rubber);

        // 3.6 本壘板與壘包
        const homePlateShape = new THREE.Shape();
        homePlateShape.moveTo(0, 0);
        homePlateShape.lineTo(0.5, -0.5);
        homePlateShape.lineTo(0.5, -1.0);
        homePlateShape.lineTo(-0.5, -1.0);
        homePlateShape.lineTo(-0.5, -0.5);
        const homePlateGeo = new THREE.ShapeGeometry(homePlateShape);
        const homePlate = new THREE.Mesh(homePlateGeo, whiteMat);
        homePlate.rotation.x = -Math.PI / 2;
        homePlate.position.set(0, 0.04, 0);
        fieldGroup.add(homePlate);

        const baseGeo = new THREE.PlaneGeometry(1.5, 1.5);
        
        // 一壘
        const base1 = new THREE.Mesh(baseGeo, whiteMat);
        base1.rotation.x = -Math.PI / 2;
        base1.rotation.z = Math.PI / 4;
        base1.position.set(19.39, 0.04, -19.39);
        fieldGroup.add(base1);

        // 二壘
        const base2 = new THREE.Mesh(baseGeo, whiteMat);
        base2.rotation.x = -Math.PI / 2;
        base2.rotation.z = Math.PI / 4;
        base2.position.set(0, 0.04, -38.78);
        fieldGroup.add(base2);

        // 三壘
        const base3 = new THREE.Mesh(baseGeo, whiteMat);
        base3.rotation.x = -Math.PI / 2;
        base3.rotation.z = Math.PI / 4;
        base3.position.set(-19.39, 0.04, -19.39);
        fieldGroup.add(base3);

        scene.add(fieldGroup);

        // --- 4. 擊球軌跡計算與畫出橘紅曲線 ---
        const radDir = (launch.Direction + 90) * (Math.PI / 180);
        const dist = landing.Distance;

        const endX = dist * Math.cos(radDir);
        const endZ = -dist * Math.sin(radDir);

        const midX = endX / 2;
        const midZ = endZ / 2;
        const apexHeight = Math.max(3, (dist * Math.tan(launch.Angle * (Math.PI / 180))) / 2);

        const curve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(0, 0.2, 0),
            new THREE.Vector3(midX, apexHeight, midZ),
            new THREE.Vector3(endX, 0.2, endZ)
        );

        // 厚管狀軌跡 (TubeGeometry)
        const tubeGeo = new THREE.TubeGeometry(curve, 50, 0.4, 8, false);
        const tubeMat = new THREE.MeshBasicMaterial({ color: 0xff3b30 }); // 鮮豔亮紅色
        const trajectoryMesh = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(trajectoryMesh);

        // 落點紅心圓球 (Landing Pin)
        const pinHeadGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const pinHeadMat = new THREE.MeshBasicMaterial({ color: 0xff1a1a });
        const pinHead = new THREE.Mesh(pinHeadGeo, pinHeadMat);
        pinHead.position.set(endX, apexHeight * 0.85, endZ); // 懸浮於落點上方
        scene.add(pinHead);

        // 落點線段
        const pinLineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(endX, 0, endZ),
            new THREE.Vector3(endX, apexHeight * 0.85, endZ)
        ]);
        const pinLine = new THREE.Line(pinLineGeo, new THREE.LineBasicMaterial({ color: 0xff1a1a, linewidth: 3 }));
        scene.add(pinLine);

        // 地面影圈/底圈
        const ringGeo = new THREE.RingGeometry(0.8, 1.2, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff1a1a, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(endX, 0.05, endZ);
        scene.add(ring);

        // --- 5. 畫面響應與渲染迴圈 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
