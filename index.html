<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒球擊球軌跡 3D 模擬器 (含自動推算功能)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
        }

        /* 頂部輸入面板 */
        #control-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 12px 15px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 18px;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #374151;
            font-weight: 500;
        }

        .input-group input {
            width: 65px;
            padding: 5px 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .input-group span.estimated {
            font-size: 11px;
            color: #2563eb;
            font-weight: bold;
            background: #eff6ff;
            padding: 2px 6px;
            border-radius: 4px;
        }

        #btn-render {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btn-render:hover {
            background-color: #1d4ed8;
        }

        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- 頂部控制與數據輸入面板 -->
    <div id="control-panel">
        <div class="input-group">
            <label>Angle (°):</label>
            <input type="number" id="inp-angle" step="0.1" placeholder="仰角" value="29.11">
        </div>
        <div class="input-group">
            <label>Direction (°):</label>
            <input type="number" id="inp-dir" step="0.1" placeholder="方向" value="-9.43">
        </div>
        <div class="input-group">
            <label>ExitSpeed (mph):</label>
            <input type="number" id="inp-speed" step="0.1" placeholder="初速" value="116.8">
        </div>
        <div class="input-group">
            <label>HitSpinRate (rpm):</label>
            <input type="number" id="inp-spin" step="1" placeholder="未知" value="">
        </div>
        <div class="input-group">
            <label>Bearing (°):</label>
            <input type="number" id="inp-bearing" step="0.1" placeholder="方位角" value="-9.43">
        </div>
        <div class="input-group">
            <label>Distance (m):</label>
            <input type="number" id="inp-dist" step="0.1" placeholder="距離" value="137.12">
        </div>
        <div class="input-group">
            <label>HangTime (s):</label>
            <input type="number" id="inp-time" step="0.01" placeholder="滯空" value="">
        </div>
        <button id="btn-render" onclick="updateSimulation()">產生軌跡</button>
    </div>

    <script>
        const g = 9.81; // 重力加速度

        // --- 1. 物理數據自動推算邏輯 ---
        function calculateHitData() {
            let angle = parseFloat(document.getElementById('inp-angle').value) || 0;
            let dir = parseFloat(document.getElementById('inp-dir').value) || 0;
            let speed = parseFloat(document.getElementById('inp-speed').value) || 0;
            let spin = parseFloat(document.getElementById('inp-spin').value) || 0;
            let bearing = parseFloat(document.getElementById('inp-bearing').value) || 0;
            let dist = parseFloat(document.getElementById('inp-dist').value) || 0;
            let time = parseFloat(document.getElementById('inp-time').value) || 0;

            // 1. 方向角與落地方位角互相補全
            if (!dir && bearing) dir = bearing;
            if (!bearing && dir) bearing = dir;

            // 2. 仰角若未填寫，自動設定預設值 15 度
            if (!angle) angle = 15;

            // 3. 初速 (mph) 與距離 (m) 的互相推算
            if (!speed && dist && angle) {
                // 由距離與仰角反推初速 v0 = sqrt(d * g / sin(2 * angle))
                const radAngle = angle * (Math.PI / 180);
                const sin2a = Math.sin(2 * radAngle);
                if (sin2a > 0) {
                    const v0_ms = Math.sqrt((dist * g) / sin2a);
                    speed = v0_ms / 0.44704; // m/s 轉 mph
                }
            }

            if (!dist && speed && angle) {
                // 由初速與仰角估計距離 d = v0^2 * sin(2 * angle) / g
                const v0_ms = speed * 0.44704;
                const radAngle = angle * (Math.PI / 180);
                dist = (Math.pow(v0_ms, 2) * Math.sin(2 * radAngle)) / g;
            }

            // 4. 滯空時間 (s) 自動推算
            if (!time && speed && angle) {
                const v0_ms = speed * 0.44704;
                const radAngle = angle * (Math.PI / 180);
                const v0y = v0_ms * Math.sin(radAngle);
                time = Math.max(0.5, (2 * v0y) / g);
            }

            // 反寫回 UI 介面，讓使用者看到自動估算的數據
            document.getElementById('inp-angle').value = angle ? angle.toFixed(2) : '';
            document.getElementById('inp-dir').value = dir ? dir.toFixed(2) : '';
            document.getElementById('inp-speed').value = speed ? speed.toFixed(1) : '';
            document.getElementById('inp-bearing').value = bearing ? bearing.toFixed(2) : '';
            document.getElementById('inp-dist').value = dist ? dist.toFixed(2) : '';
            document.getElementById('inp-time').value = time ? time.toFixed(2) : '';

            return {
                angle,
                direction: dir,
                speed,
                spinRate: spin || null,
                bearing,
                distance: dist,
                hangTime: time
            };
        }

        // --- 2. 初始化 Three.js 場景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 110, 130);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, -45);

        // --- 3. 繪製極簡棒球場 ---
        const fieldGroup = new THREE.Group();

        // 外野草地
        const grassGeo = new THREE.RingGeometry(0, 120, 64, 1, Math.PI * 0.25, Math.PI * 0.5);
        const grassMat = new THREE.MeshBasicMaterial({ color: 0x598353, side: THREE.DoubleSide });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        fieldGroup.add(grass);

        // 內野紅土區
        const dirtGeo = new THREE.RingGeometry(0, 28.9, 48, 1, Math.PI * 0.25, Math.PI * 0.5);
        const dirtMat = new THREE.MeshBasicMaterial({ color: 0xc1a173, side: THREE.DoubleSide });
        const dirt = new THREE.Mesh(dirtGeo, dirtMat);
        dirt.rotation.x = -Math.PI / 2;
        dirt.position.y = 0.01;
        fieldGroup.add(dirt);

        // 白線
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        const rightLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.03, 0), new THREE.Vector3(85, 0.03, -85)]);
        const leftLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.03, 0), new THREE.Vector3(-85, 0.03, -85)]);
        fieldGroup.add(new THREE.Line(rightLineGeo, lineMat));
        fieldGroup.add(new THREE.Line(leftLineGeo, lineMat));

        // 投手丘與投手板
        const moundGeo = new THREE.CircleGeometry(2.75, 32);
        const moundMat = new THREE.MeshBasicMaterial({ color: 0xc1a173, side: THREE.DoubleSide });
        const mound = new THREE.Mesh(moundGeo, moundMat);
        mound.rotation.x = -Math.PI / 2;
        mound.position.set(0, 0.03, -18.44);
        fieldGroup.add(mound);

        const rubberGeo = new THREE.PlaneGeometry(0.8, 0.3);
        const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        const rubber = new THREE.Mesh(rubberGeo, whiteMat);
        rubber.rotation.x = -Math.PI / 2;
        rubber.position.set(0, 0.04, -18.44);
        fieldGroup.add(rubber);

        // 本壘板與壘包
        const homePlateShape = new THREE.Shape();
        homePlateShape.moveTo(0, 0);
        homePlateShape.lineTo(0.5, -0.5);
        homePlateShape.lineTo(0.5, -1.0);
        homePlateShape.lineTo(-0.5, -1.0);
        homePlateShape.lineTo(-0.5, -0.5);
        const homePlateGeo = new THREE.ShapeGeometry(homePlateShape);
        const homePlate = new THREE.Mesh(homePlateGeo, whiteMat);
        homePlate.rotation.x = -Math.PI / 2;
        homePlate.position.set(0, 0.04, 0);
        fieldGroup.add(homePlate);

        const baseGeo = new THREE.PlaneGeometry(1.2, 1.2);
        [
            { x: 19.39, z: -19.39 },
            { x: 0, z: -38.78 },
            { x: -19.39, z: -19.39 }
        ].forEach(pos => {
            const base = new THREE.Mesh(baseGeo, whiteMat);
            base.rotation.x = -Math.PI / 2;
            base.rotation.z = Math.PI / 4;
            base.position.set(pos.x, 0.04, pos.z);
            fieldGroup.add(base);
        });

        scene.add(fieldGroup);

        // --- 4. 動態生成與繪製軌跡 ---
        let trajectoryMesh, pinHead;

        function updateSimulation() {
            const data = calculateHitData();

            // 若已有軌跡，先將舊的移除
            if (trajectoryMesh) scene.remove(trajectoryMesh);
            if (pinHead) scene.remove(pinHead);

            const hitHeight = 1.0; // 固定擊球高度 1 米
            const radDir = data.direction * (Math.PI / 180);
            const radAngle = data.angle * (Math.PI / 180);
            const dist = data.distance;

            const endX = dist * Math.sin(radDir);
            const endZ = -dist * Math.cos(radDir);

            const midX = endX / 2;
            const midZ = endZ / 2;

            // 頂點高度計算
            const apexHeight = hitHeight + Math.max(1.5, dist * Math.sin(radAngle) * 0.45);

            // 建立 3D 曲線
            const curve = new THREE.QuadraticBezierCurve3(
                new THREE.Vector3(0, hitHeight, 0),
                new THREE.Vector3(midX, apexHeight, midZ),
                new THREE.Vector3(endX, 0.2, endZ)
            );

            // 繪製軌跡管線
            const tubeGeo = new THREE.TubeGeometry(curve, 60, 0.6, 8, false);
            const tubeMat = new THREE.MeshBasicMaterial({ color: 0xee3f33 });
            trajectoryMesh = new THREE.Mesh(tubeGeo, tubeMat);
            scene.add(trajectoryMesh);

            // 落地點紅色球體
            const pinHeadGeo = new THREE.SphereGeometry(1.5, 32, 32);
            const pinHeadMat = new THREE.MeshBasicMaterial({ color: 0xee3f33 });
            pinHead = new THREE.Mesh(pinHeadGeo, pinHeadMat);
            pinHead.position.set(endX, 0.2, endZ);
            scene.add(pinHead);
        }

        // 頁面載入後先執行一次
        updateSimulation();

        // --- 5. 畫面響應與渲染迴圈 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
