<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒球擊球軌跡 3D 模擬器</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }

        /* 可折疊的控制面板容器 */
        #info-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            width: 280px;
            font-size: 13px;
            line-height: 1.5;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* 隱藏面板時的樣式 */
        #info-panel.collapsed {
            transform: translateX(-320px);
            opacity: 0;
            pointer-events: none;
        }

        /* 控制面板開啟/關閉的獨立按鈕 */
        #toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 11;
            background: #2ed573;
            color: #111;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        #info-panel h2 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: #4da6ff;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #222;
            color: #7bed9f;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            padding: 5px;
            box-sizing: border-box;
            resize: vertical;
        }

        .action-btn {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            background: #2ed573;
            border: none;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #26af5f;
            color: #fff;
        }

        .close-panel-btn {
            background: #ff4757;
            color: #fff;
            margin-top: 10px;
        }

        .close-panel-btn:hover {
            background: #e84118;
        }

        .data-group {
            margin-bottom: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <button id="toggle-btn" onclick="togglePanel()">選單 ⚙️</button>

    <div id="info-panel">
        <h2>貼上擊球 JSON 數據</h2>
        <textarea id="json-input" placeholder='直接貼上 "Hit": { ... }'></textarea>
        <button class="action-btn" onclick="updateFromInput()">產生 3D 模擬軌跡</button>
        
        <h2 style="margin-top: 15px;">目前顯示數據</h2>
        <div id="data-display">載入中...</div>

        <button class="action-btn close-panel-btn" onclick="togglePanel()">收合控制面板 ✕</button>
    </div>

    <script>
        // --- 1. 開關面板功能 ---
        function togglePanel() {
            const panel = document.getElementById('info-panel');
            panel.classList.toggle('collapsed');
        }

        // --- 2. 預設數據 ---
        const defaultHitData = {
            "Hit": {
                "Launch": {
                    "Angle": 29.583567,
                    "Direction": -37.228,
                    "ExitSpeed": 93.10412314368,
                    "HitSpinRate": 5328.806
                },
                "LandingFlat": {
                    "Bearing": -45.25206,
                    "Distance": 46.182540096,
                    "HangTime": 2.605532,
                    "Confidence": null
                }
            }
        };

        // --- 3. 解析網址參數 (URL Parameters) ---
        function parseUrlData() {
            const params = new URLSearchParams(window.location.search);
            
            if (params.has('data')) {
                try {
                    return JSON.parse(params.get('data'));
                } catch(e) {
                    console.error("JSON 解析失敗，載入預設值");
                }
            }

            if (params.has('la') || params.has('dist')) {
                return {
                    "Hit": {
                        "Launch": {
                            "Angle": parseFloat(params.get('la')) || defaultHitData.Hit.Launch.Angle,
                            "Direction": parseFloat(params.get('dir')) || defaultHitData.Hit.Launch.Direction,
                            "ExitSpeed": parseFloat(params.get('speed')) || defaultHitData.Hit.Launch.ExitSpeed,
                            "HitSpinRate": parseFloat(params.get('spin')) || defaultHitData.Hit.Launch.HitSpinRate
                        },
                        "LandingFlat": {
                            "Bearing": parseFloat(params.get('dir')) || defaultHitData.Hit.LandingFlat.Bearing,
                            "Distance": parseFloat(params.get('dist')) || defaultHitData.Hit.LandingFlat.Distance,
                            "HangTime": parseFloat(params.get('time')) || defaultHitData.Hit.LandingFlat.HangTime
                        }
                    }
                };
            }

            return defaultHitData;
        }

        // --- 4. 按鈕事件：自動修復文字並更新 URL ---
        function updateFromInput() {
            let rawText = document.getElementById('json-input').value.trim();
            if (!rawText) return;

            if (rawText.startsWith('"Hit"') || rawText.startsWith('Hit')) {
                rawText = '{' + rawText + '}';
            }

            try {
                JSON.parse(rawText);
                const encoded = encodeURIComponent(rawText);
                window.location.search = '?data=' + encoded;
            } catch(e) {
                alert('JSON 格式錯誤，請確定內容輸入正確！');
            }
        }

        const hitData = parseUrlData();
        const launch = hitData.Hit.Launch;
        const landing = hitData.Hit.LandingFlat;

        // 更新 UI 數據顯示
        document.getElementById('data-display').innerHTML = `
            <div class="data-group"><b>擊球初速:</b> ${launch.ExitSpeed.toFixed(1)} mph</div>
            <div class="data-group"><b>仰角 (Angle):</b> ${launch.Angle.toFixed(2)}°</div>
            <div class="data-group"><b>方向角 (Direction):</b> ${launch.Direction.toFixed(2)}°</div>
            <div class="data-group"><b>飛行距離 (Distance):</b> ${landing.Distance.toFixed(2)} m</div>
            <div class="data-group"><b>滯空時間:</b> ${landing.HangTime ? landing.HangTime.toFixed(2) + ' s' : 'N/A'}</div>
            <div class="data-group"><b>轉速 (Spin Rate):</b> ${launch.HitSpinRate ? launch.HitSpinRate.toFixed(0) + ' rpm' : 'N/A'}</div>
        `;

        // --- 5. 初始化 Three.js 3D 場景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111827);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 75);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(30, 60, 30);
        scene.add(dirLight);

        // --- 6. 建構棒球場基本元素 ---
        const fieldGroup = new THREE.Group();

        // 草皮
        const grassGeo = new THREE.PlaneGeometry(200, 200);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x10b981 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        fieldGroup.add(grass);

        // 本壘板
        const homePlateShape = new THREE.Shape();
        homePlateShape.moveTo(0, 0);
        homePlateShape.lineTo(0.3, -0.3);
        homePlateShape.lineTo(0.3, -0.6);
        homePlateShape.lineTo(-0.3, -0.6);
        homePlateShape.lineTo(-0.3, -0.3);
        const homePlateGeo = new THREE.ShapeGeometry(homePlateShape);
        const homePlateMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        const homePlate = new THREE.Mesh(homePlateGeo, homePlateMat);
        homePlate.rotation.x = -Math.PI / 2;
        homePlate.position.set(0, 0.02, 0);
        fieldGroup.add(homePlate);

        // 投手丘
        const moundGeo = new THREE.CylinderGeometry(2, 2.5, 0.2, 32);
        const moundMat = new THREE.MeshLambertMaterial({ color: 0xd97706 });
        const mound = new THREE.Mesh(moundGeo, moundMat);
        mound.position.set(0, 0.05, -18.4);
        fieldGroup.add(mound);

        // 白線 / 界外線
        const foulLineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
        
        const rightFoulGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0.02, 0),
            new THREE.Vector3(80, 0.02, -80)
        ]);
        fieldGroup.add(new THREE.Line(rightFoulGeo, foulLineMat));

        const leftFoulGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0.02, 0),
            new THREE.Vector3(-80, 0.02, -80)
        ]);
        fieldGroup.add(new THREE.Line(leftFoulGeo, foulLineMat));

        // 外野牆
        const fenceGeo = new THREE.CylinderGeometry(90, 90, 3, 32, 1, true, Math.PI * 0.25, Math.PI * 0.5);
        const fenceMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a, side: THREE.DoubleSide });
        const fence = new THREE.Mesh(fenceGeo, fenceMat);
        fence.position.set(0, 1.5, 0);
        fieldGroup.add(fence);

        scene.add(fieldGroup);

        // --- 7. 計算並繪製 3D 軌跡弧線 ---
        const radDir = (launch.Direction + 90) * (Math.PI / 180);
        const dist = landing.Distance;

        const endX = dist * Math.cos(radDir);
        const endZ = -dist * Math.sin(radDir);
        const endY = 0;

        const midX = endX / 2;
        const midZ = endZ / 2;
        const apexHeight = Math.max(2, (dist * Math.tan(launch.Angle * (Math.PI / 180))) / 2);

        const curve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(0, 0.2, 0),
            new THREE.Vector3(midX, apexHeight, midZ),
            new THREE.Vector3(endX, endY, endZ)
        );

        const points = curve.getPoints(50);
        const trajectoryGeo = new THREE.BufferGeometry().setFromPoints(points);
        const trajectoryMat = new THREE.LineDashedMaterial({
            color: 0xef4444,
            dashSize: 1,
            gapSize: 0.5,
            linewidth: 3
        });
        const trajectoryLine = new THREE.Line(trajectoryGeo, trajectoryMat);
        trajectoryLine.computeLineDistances();
        scene.add(trajectoryLine);

        // 落點標記
        const landingMarkerGeo = new THREE.RingGeometry(0.4, 0.8, 32);
        const landingMarkerMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide });
        const landingMarker = new THREE.Mesh(landingMarkerGeo, landingMarkerMat);
        landingMarker.rotation.x = -Math.PI / 2;
        landingMarker.position.set(endX, 0.03, endZ);
        scene.add(landingMarker);

        // --- 8. 渲染迴圈 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
